name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.23", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./logentry
      - run: go test -run '^$' -fuzz '^FuzzScan$' -fuzztime 20s ./linescan
      - run: go test -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 20s ./analysis
